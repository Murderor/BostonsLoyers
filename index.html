<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://*.supabase.co https://*.discord.com; img-src 'self' data: https: http:;">
    <title>Коллегия государственных адвокатов | Majestic RP | Boston</title>
    <link rel="stylesheet" href="css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Прелоадер -->
    <div class="preloader" id="preloader">
        <div class="preloader-content">
            <div class="preloader-logo-wrapper">
                <img src="assets/logo.png" alt="Герб адвокатуры" class="preloader-logo">
                <div class="preloader-ring"></div>
            </div>
            <div class="preloader-text">
                <div>Коллегия государственных адвокатов</div>
                <div class="preloader-subtitle">Majestic RP | Boston</div>
            </div>
            <div class="preloader-spinner"></div>
        </div>
    </div>

    <div class="app-container" style="display: none;" id="app-container">
        <header class="header">
            <div class="container">
                <div class="header-content">
                    <div class="logo">
                        <img src="assets/logo.png" alt="Герб адвокатуры" class="logo-img">
                        <div class="logo-text">
                            <h1>Коллегия государственных адвокатов</h1>
                            <p class="logo-subtitle">Majestic RP | Boston</p>
                        </div>
                    </div>
                    <nav class="main-nav" id="main-nav"></nav>
                    <div class="user-info" id="user-info"></div>
                </div>
            </div>
        </header>

        <main class="main-content" id="main-content">
            <div class="container">
                <div id="page-content">
                    <div class="loader">Загрузка...</div>
                </div>
            </div>
        </main>

        <footer class="footer">
            <div class="container">
                <p>© 2026 Коллегия государственных адвокатов | Majestic RP | Boston. Все права защищены.</p>
            </div>
        </footer>
    </div>

    <div id="auth-modal" class="modal" style="display: none;">
        <div class="modal-content">
            <span class="close-btn" id="close-modal">&times;</span>
            <div id="auth-forms"></div>
        </div>
    </div>

    <!-- Порядок загрузки важен! -->
    <script src="js/utils.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/pages/home.js"></script>
    <script src="js/pages/profile.js"></script>
    <script src="js/pages/lawyers.js"></script>
    <script src="js/pages/appeals.js"></script>
    <script src="js/pages/senior.js"></script>
    <script src="js/pages/admin.js"></script>
    <script src="js/pages/lawyer-reports.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
